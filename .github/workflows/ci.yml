name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        openspec: ["1.8.0", "latest-1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - name: Install pinned OpenSpec
        if: matrix.openspec != 'latest-1'
        run: npm install --global "@fission-ai/openspec@${{ matrix.openspec }}"
      - name: Install latest OpenSpec 1.x
        if: matrix.openspec == 'latest-1'
        run: npm install --global "@fission-ai/openspec@^1"
      - name: Validate Skill metadata
        run: python tests/validate_skill.py
      - name: Run unit and real integration tests
        env:
          OPENSPEC_EXPECT_VERSION: ${{ matrix.openspec != 'latest-1' && matrix.openspec || '' }}
        run: python -m unittest discover -s tests -v
