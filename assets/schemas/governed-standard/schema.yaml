name: governed-standard
version: 1
description: Spec-driven change with a durable cross-session handoff

artifacts:
  - id: proposal
    generates: proposal.md
    description: Change intent, scope, impact, and risk profile
    template: proposal.md
    instruction: |
      Explain why the change is needed, what is and is not in scope, its impact,
      and why the selected governance risk profile is appropriate.
    requires: []

  - id: specs
    generates: specs/**/*.md
    description: Delta requirements and observable scenarios
    template: spec.md
    instruction: |
      Write delta specs for user-visible or contractual behavior. Use ADDED,
      MODIFIED, REMOVED, or RENAMED requirement sections and Given/When/Then
      scenarios. Preserve complete modified requirement text.
    requires: [proposal]

  - id: design
    generates: design.md
    description: Technical decisions, tradeoffs, validation, and rollout
    template: design.md
    instruction: |
      Explain the implementation approach and decisions. Cover contracts, failure
      handling, verification, compatibility, migration, and rollout when relevant.
    requires: [proposal]

  - id: tasks
    generates: tasks.md
    description: Dependency-ordered implementation and verification checklist
    template: tasks.md
    instruction: |
      Create bounded, dependency-ordered checkbox tasks. Every task must produce a
      concrete deliverable or verification result and map to the proposal and specs.
    requires: [specs, design]

  - id: handoff
    generates: handoff.md
    description: Mutable owner, checkpoint, evidence, and exact restart action
    template: handoff.md
    instruction: |
      Create the initial factual handoff. Assign exactly one writer and branch or
      worktree. Record a real Git checkpoint commit and time, use planned status,
      identify the first task, and state one exact next action. Update structured
      verification evidence during apply; do not put requirements or secrets here.
    requires: [tasks]

apply:
  requires: [tasks, handoff]
  tracks: tasks.md
